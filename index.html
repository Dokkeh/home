<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sanctuary | Clean Space</title>
    <style>
        /* CSS Reset and Font Import */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Urbanist:wght@200;400;600&display=swap');

        :root {
            --bg-color: #fdfdfc; /* Off-white, soft background */
            --text-dark: #2c3531; /* Deep, muted slate */
            --accent-soft: #d2b48c; /* Soft Tan/Gold */
            --subtle-gray: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Urbanist', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Header / Minimal Nav --- */
        header {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--subtle-gray);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: var(--text-dark);
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 200;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-soft);
        }

        /* --- Hero Section --- */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4rem 5%;
            position: relative;
        }

        /* Abstract Subtle Background Shape */
        .hero::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border: 1px solid #f0eae0;
            border-radius: 50%;
            top: 10%;
            right: -5%;
            z-index: -1;
        }

        .hero::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: #f7f3ed;
            border-radius: 0 50% 50% 50%;
            bottom: 5%;
            left: -2%;
            z-index: -1;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            max-width: 800px;
        }

        .hero h1 span {
            font-style: italic;
            color: var(--accent-soft);
        }

        .hero p {
            font-size: 1.2rem;
            font-weight: 200;
            letter-spacing: 0.5px;
            max-width: 600px;
            margin-bottom: 3rem;
            color: #555;
        }

        /* Call to Action Button */
        .cta-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            background-color: transparent;
            border: 1px solid var(--text-dark);
            color: var(--text-dark);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 3px;
            font-weight: 600;
            transition: all 0.4s ease;
        }

        .cta-button:hover {
            background-color: var(--text-dark);
            color: var(--bg-color);
        }

        /* --- Footer --- */
        footer {
            padding: 2rem 5%;
            text-align: center;
            border-top: 1px solid var(--subtle-gray);
            font-size: 0.8rem;
            font-weight: 200;
            color: #888;
            letter-spacing: 1px;
        }

        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.8rem;
            }
            header {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">Sanctuary</a>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Reflection</a></li>
                <li><a href="#">Space</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero">
        <h1>A <span>mindful</span> digital space, <br> Built with intent.</h1>
        <p>This is a placeholder for something meaningful. A clean environment for growth, knowledge, and respect.</p>
        <a href="#" class="cta-button">Explore Further</a>
    </main>

    <footer>
        <p>&copy; 1445 H | Dedicated to purposeful creation.</p>
    </footer>

</body>
</html>
